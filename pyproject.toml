[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citehero"
version = "0.1.0"
description = "Local page-grounded OCR + RAG pipeline for course readings and essay drafting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pymupdf>=1.24",
  "pillow>=10.0",
  "llama-index-core>=0.12",
  "llama-index-embeddings-ollama>=0.9",
  "llama-index-llms-ollama>=0.10",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7"]

[project.scripts]
citehero = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
